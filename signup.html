<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up </title>
    <link rel="icon" href="images/titleLogo.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Sans+Sinhala:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            -webkit-font-smoothing: antialiased
        }

        :root {
            --cream: #f2f7f0;
            --sage: #5f8f65;
            --sage-d: #3a6b40;
            --sage-l: #b8d8bc;
            --sage-ll: #dff0de;
            --sage-lll: #eef8ed;
            --terra: #c4785a;
            --terra-d: #a85c42;
            --terra-l: #f0d8cc;
            --terra-ll: #fdf3ee;
            --char: #1e2e20;
            --gray: #6a7d6c;
            --muted: #9ab09c;
            --white: #ffffff;
            --ff-d: 'Playfair Display', Georgia, serif;
            --ff-b: 'DM Sans', sans-serif;
            --ff-s: 'Noto Sans Sinhala', sans-serif;
            --shadow-sm: 0 2px 8px rgba(45, 48, 40, 0.07);
            --shadow-md: 0 8px 32px rgba(45, 48, 40, 0.10);
            --shadow-lg: 0 20px 60px rgba(45, 48, 40, 0.13);
        }

        body {
            font-family: var(--ff-b);
            color: var(--char);
            background: #edf5eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }


        /* AMBIENT BACKGROUND */

        .bg-ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 65% 60% at 92% 8%, #c8dfc8 0%, transparent 65%),
                radial-gradient(ellipse 55% 50% at 5% 75%, #b8d8bc 0%, transparent 62%),
                radial-gradient(ellipse 40% 38% at 50% 52%, #d4e8d0 0%, transparent 58%),
                radial-gradient(ellipse 35% 32% at 15% 20%, #f0d8cc 0%, transparent 55%),
                #edf5eb;
        }

        /* Floating particles */
        .particle-field {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden
        }

        .ptc {
            position: absolute;
            opacity: 0;
            animation: ptcDrift linear infinite;
            will-change: transform
        }

        @keyframes ptcDrift {
            0% {
                opacity: 0;
                transform: translateY(0) rotate(0deg) scale(0.7)
            }

            8% {
                opacity: 0.4
            }

            88% {
                opacity: 0.2
            }

            100% {
                opacity: 0;
                transform: translateY(var(--ptc-y)) translateX(var(--ptc-x)) rotate(var(--ptc-r)) scale(1.1)
            }
        }

        /* Navigation */
        .nav {
            position: relative;
            z-index: 20;
            padding: clamp(14px, 2.5vh, 22px) clamp(20px, 4vw, 52px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(237, 245, 235, 0.88);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(184, 216, 188, 0.35);
            animation: navSlide 0.7s ease both;
        }

        @keyframes navSlide {
            from {
                opacity: 0;
                transform: translateY(-14px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none
        }

        .nav-logo img {
            height: clamp(26px, 3.2vw, 40px);
            width: auto
        }

        .nav-brand {
            font-family: var(--ff-d);
            font-size: clamp(1rem, 2.2vw, 1.4rem);
            font-weight: 700;
            color: var(--char)
        }

        .nav-brand .s {
            font-family: var(--ff-s);
            font-size: 0.68em;
            color: var(--sage);
            margin-left: 3px
        }

        .nav-home {
            font-size: 0.84rem;
            font-weight: 500;
            color: var(--gray);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .nav-home:hover {
            color: var(--sage-d)
        }

        .nav-home svg {
            width: 16px;
            height: 16px
        }

        /* MAIN — centered layout */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            padding: clamp(24px, 5vh, 60px) 20px;
        }

        /*  SIGN IN CARD */
        .card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            border: 1px solid var(--sage-l);
            box-shadow: var(--shadow-lg), 0 0 0 4px rgba(184, 216, 188, 0.12);
            backdrop-filter: blur(16px);
            overflow: hidden;
            animation: cardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.97)
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }

        /* Card top stripe */
        .card-stripe {
            height: 5px;
            background: linear-gradient(90deg, var(--sage-d) 0%, var(--sage) 45%, var(--terra) 100%);
        }

        .card-body {
            padding: clamp(28px, 5vh, 44px) clamp(24px, 5vw, 40px) clamp(24px, 4vh, 36px);
        }

        /* Logo area */
        .card-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: clamp(20px, 3.5vh, 32px);
            animation: fadeUp 0.6s ease 0.4s both;
        }

        .card-logo img {
            width: clamp(52px, 8vw, 72px);
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(95, 143, 101, 0.2));
        }

        .card-logo-word {
            font-family: var(--ff-d);
            font-size: clamp(1.3rem, 3vw, 1.7rem);
            font-weight: 700;
            color: var(--char);
            letter-spacing: -0.4px;
        }

        .card-logo-word .g {
            color: var(--sage-d)
        }


        /* Heading */
        .card-heading {
            font-family: var(--ff-d);
            font-size: clamp(1.3rem, 3.5vw, 1.8rem);
            font-weight: 700;
            color: var(--terra);
            letter-spacing: -0.5px;
            line-height: 1.1;
            margin-bottom: 6px;
            animation: fadeUp 0.6s ease 0.5s both;
        }

        .card-heading em {
            color: var(--terra);
            font-style: italic
        }

        .card-sub {
            font-size: 0.84rem;
            color: var(--gray);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: clamp(20px, 3vh, 28px);
            animation: fadeUp 0.6s ease 0.55s both;
        }

        /* Divider */
        .form-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: clamp(18px, 2.5vh, 24px);
            animation: fadeUp 0.6s ease 0.6s both;
        }

        .form-divider-line {
            flex: 1;
            height: 1px;
            background: var(--sage-l)
        }

        .form-divider-label {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--sage-d);
            white-space: nowrap;
        }

        /* Fields */
        .field {
            margin-bottom: clamp(12px, 2vh, 18px);
            animation: fadeUp 0.6s ease both;
        }

        .field:nth-child(1) {
            animation-delay: 0.65s
        }

        .field:nth-child(2) {
            animation-delay: 0.72s
        }

        .field:nth-child(3) {
            animation-delay: 0.79s
        }

        .field-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.76rem;
            font-weight: 500;
            color: var(--gray);
            letter-spacing: 0.3px;
            margin-bottom: 7px;
        }

        .field-label svg {
            width: 13px;
            height: 13px;
            opacity: 0.6
        }

        .field-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1.5px solid var(--sage-l);
            background: var(--sage-lll);
            font-family: var(--ff-b);
            font-size: 0.9rem;
            color: var(--char);
            outline: none;
            transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
        }

        .field-input:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(95, 143, 101, 0.14);
            background: var(--white);
        }

        .field-input::placeholder {
            color: var(--muted);
            font-weight: 300
        }

        /* Password wrapper */
        .pw-wrap {
            position: relative
        }

        .pw-wrap .field-input {
            padding-right: 44px
        }

        .pw-toggle {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--muted);
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .pw-toggle:hover {
            color: var(--sage-d)
        }



        /* Buttons */
        .btn-signup {
            width: 100%;
            padding: clamp(12px, 1.8vh, 15px) 24px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--sage-d) 0%, var(--sage) 100%);
            color: var(--white);
            font-family: var(--ff-b);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.34, 1.1, 0.64, 1);
            box-shadow: 0 6px 20px rgba(58, 107, 64, 0.28);
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.6s ease 0.82s both;
            margin-bottom: clamp(10px, 1.5vh, 14px);
        }

        .btn-signup::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-signup:hover::before {
            opacity: 1
        }

        .btn-signup:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 10px 28px rgba(58, 107, 64, 0.36)
        }

        .btn-signup:active {
            transform: translateY(1px) scale(0.99);
            transition: 100ms
        }

        .btn-signup svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0
        }

        .btn-skip {
            width: 100%;
            padding: clamp(11px, 1.6vh, 14px) 24px;
            border-radius: 14px;
            border: 1.5px solid var(--sage-l);
            background: transparent;
            color: var(--sage-d);
            font-family: var(--ff-b);
            font-size: 0.9rem;
            font-weight: 400;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: all 0.22s;
            animation: fadeUp 0.6s ease 0.88s both;
            margin-bottom: clamp(14px, 2vh, 20px);
        }

        .btn-skip:hover {
            background: var(--sage-lll);
            border-color: var(--sage);
            color: var(--sage-d)
        }

        .btn-skip:active {
            transform: scale(0.98)
        }

        /* Signup link */
        .signup-row {
            text-align: center;
            animation: fadeUp 0.6s ease 0.94s both;
        }

        .signup-row p {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 300
        }

        .signup-link {
            color: var(--terra);
            font-weight: 500;
            font-size: 0.82rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.2s;
            margin-top: 6px;
        }

        .signup-link:hover {
            opacity: 0.7;
            text-decoration: underline
        }

        .signup-link svg {
            width: 13px;
            height: 13px
        }

        /* FOOTER */
        footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: clamp(14px, 2.5vh, 22px) 24px;
            font-size: 0.72rem;
            color: var(--muted);
            border-top: 1px solid var(--sage-l);
            background: rgba(223, 240, 222, 0.4);
        }

        .footer-brand {
            color: var(--sage-d);
            font-family: var(--ff-d);
            font-style: italic
        }

        /* Shared keyframes */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* Responsive */
        @media(max-width:500px) {
            .card-body {
                padding: 24px 20px 20px
            }
        }
    </style>
</head>

<body>
    <div class="bg-ambient"></div>

    <div class="particle-field" id="particle-field"></div>

    <!-- navigation -->
    <nav class="nav">
        <a href="home.html" class="nav-logo">
            <img src="images/logo-removebg-preview.png">
            <span class="nav-brand">Medi<span class="s"> ආහාර</span></span>
        </a>
        <a href="home.html" class="nav-home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18px" height="18px">

            </svg>

        </a>
    </nav>

    <!-- MAIN -->
    <main class="main">
        <div class="card">

            <!-- Top colour stripe -->
            <div class="card-stripe"></div>

            <div class="card-body">

                <!-- Logo -->
                <div class="card-logo">
                    <img src="images/LOGINPICTURE.png" alt="MedMeal" onerror="this.style.display='none'">
                    <span class="card-logo-word">Medi<span class="g"> ආහාර</span></span>
                </div>

                <!-- Heading -->
                <h1 class="card-heading">Welcome</h1>

                <!-- Divider -->
                <div class="form-divider">
                    <div class="form-divider-line"></div>
                    <span class="form-divider-label">Your credentials</span>
                    <div class="form-divider-line"></div>
                </div>

                <!-- Form -->
                <form class="signin-form" action="SignUp.php" method="post">

                    <div class="field">
                        <label class="field-label" for="name">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="2" />

                        </label>
                        <input class="field-input" type="name" id="name" name="name" placeholder="e.g. John Doe"

                    <div class="field">
                        <label class="field-label" for="email">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                        </label>

                    <div class="field">
                        <label class="field-label" for="password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" />
                                <path d="M7 11V7a5 5 0 0110 0v4" />
                            </svg>

                        </label>
                        <div class="pw-wrap">
                            <input class="field-input" type="password" id="password" name="password"
                                placeholder="Your password" required>
                            <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="Show password">

                    <!-- Primary: Sign In -->
                    <button class="btn-signup" type="submit">

                        </svg>

                    <button class="btn-skip" type="button" onclick="window.location.href='Front_End.php'">

                    </button>

                </form>

                <!-- Sign up link -->
                <div class="signup-row">
                    <p> have an account? </p>
                    <a href="signin.html" class="signup-link">

            </div><!-- /card-body -->
        </div><!-- /card -->

                style="font-family:var(--ff-s);font-size:0.9em;color:var(--muted)">ආහාර</span></span>
        &nbsp;·&nbsp; © 2026 MedMeal. All rights reserved.
    </footer>

    <script>
        /* Password toggle */
        function togglePw(btn) {
            const inp = document.getElementById('password');
            const isText = inp.type === 'text';
            inp.type = isText ? 'password' : 'text';
            btn.querySelector('svg').style.opacity = isText ? '1' : '0.45';
        }

        /* Floating particles — same logic as front end */
        const field = document.getElementById('particle-field');
        const items = ['🥬', '🌿', '🍃', '🥑', '🥗', '🧀', '🍎', '🍓', '🫑', '🥕', '🫛', '🥦', '🍆', '🫚', '🧄', '🫘', '🌾', '🥝'];
        function spawn() {
            const el = document.createElement('div');
            el.className = 'ptc';
            el.textContent = items[Math.floor(Math.random() * items.length)];
            const x = Math.random() * 100;
            const dur = 12 + Math.random() * 14;
            const dy = -(55 + Math.random() * 40);
            const dx = (Math.random() - 0.5) * 28;
            const rot = (Math.random() - 0.5) * 360;
            el.style.cssText = `left:${x}%;bottom:${-5 + Math.random() * 8}%;--ptc-y:${dy}vh;--ptc-x:${dx}vw;--ptc-r:${rot}deg;animation-duration:${dur}s;animation-delay:${Math.random() * dur}s;font-size:${0.75 + Math.random() * 0.6}rem`;
            field.appendChild(el);
            setTimeout(() => el.remove(), (dur + 4) * 1000);
        }
        for (let i = 0; i < 18; i++) setTimeout(spawn, i * 900);
        setInterval(spawn, 2000);
    </script>
